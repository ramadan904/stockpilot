name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - name: Web ABIs match the contracts
        run: node scripts/export-abi.mjs && git diff --exit-code web/src/abi.ts
      - run: npm run typecheck
      - run: npm run web:build
      - run: npm test
      - run: npm run demo
