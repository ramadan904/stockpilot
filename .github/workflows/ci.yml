name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Slither (fails on any finding not triaged in slither.db.json; see SECURITY.md)
        run: |
          pip install -q slither-analyzer==0.11.6
          slither . --config-file slither.config.json --fail-low
      - name: Web ABIs match the contracts
        run: node scripts/export-abi.mjs && git diff --exit-code web/src/abi.ts
      - run: npm run typecheck
      - run: npm run web:build
      - run: npm test
      - run: npm run demo

  solana:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  conformance-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rust conformance vectors match the TypeScript model
        run: npm run --silent vectors && git diff --exit-code solana/mandate-core/tests/vectors.json solana/mandate-core/tests/guard-vectors.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against a local chain
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Service image end to end (local chain, vault, pilot trades, health, metrics, graceful stop)
        run: ./scripts/docker-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-smoke-log
          path: docker-smoke.log
