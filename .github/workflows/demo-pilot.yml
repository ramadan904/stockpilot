# Keeps the public demo vault alive without a server: every hour, push real stock prices onto the testnet feeds,
# then let the demo vault's own pilot make the one trade (if any) its planner and the contract allow. The keys are
# repository secrets (Settings > Secrets and variables > Actions): RELAYER_KEY, the key that deployed the feeds, and
# DEMO_PILOT_KEY, the demo vault's pilot (.secrets/demo-pilot-robinhoodTestnet.key). Arbitrum Sepolia runs alongside
# with DEMO_PILOT_KEY_ARBITRUM (.secrets/demo-pilot-arbitrumSepolia.key); RELAYER_KEY serves both, since the same key
# deployed both. Without them the job does nothing. Prices come from Yahoo Finance (no key), or from Pyth's Hermes
# when the optional PYTH_API_KEY secret is set.
# About once a day the pilot also publishes a letter to the owner in the pilot journal (in Claude's words when the
# optional ANTHROPIC_API_KEY secret is set).
name: Demo pilot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      addons:
        description: "First bring the add-on contracts up to date (scripts/deploy-addons.ts) and print each deployment file to commit"
        type: boolean
        default: false


permissions:
  contents: read

jobs:
  fly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one chain's slow RPC never stops the other's pilot
      matrix:
        network: [robinhoodTestnet, arbitrumSepolia]
    concurrency:
      group: demo-pilot-${{ matrix.network }}
      cancel-in-progress: false
    env:
      NETWORK: ${{ matrix.network }}
      # Each chain's demo vault has its own pilot key; never another chain's.
      DEMO_KEY: ${{ matrix.network == 'arbitrumSepolia' && secrets.DEMO_PILOT_KEY_ARBITRUM || matrix.network != 'arbitrumSepolia' && secrets.DEMO_PILOT_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Is StockPilot deployed on this chain?
        run: |
          test -f "deployments/$NETWORK.json" || { echo "No deployments/$NETWORK.json, so nothing to fly."; exit 1; }
      - run: npm ci
      - run: npx hardhat compile --quiet
      - name: Add-on contracts up to date (only when asked)
        if: ${{ inputs.addons }}
        env:
          PRIVATE_KEY: ${{ secrets.RELAYER_KEY }}
        run: |
          npx hardhat run scripts/deploy-addons.ts --network "$NETWORK"
          echo "Commit this as deployments/$NETWORK.json:"
          cat "deployments/$NETWORK.json"
      - name: Real stock prices onto the feeds
        env:
          PRIVATE_KEY: ${{ secrets.RELAYER_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          ONCE: "1"
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "No RELAYER_KEY secret: skipping prices."; exit 0; fi
          npx hardhat run agent/relayer-run.ts --network "$NETWORK"
      - name: The demo vault's Verified Mandate (starts the clock, then mints when due)
        env:
          PRIVATE_KEY: ${{ secrets.RELAYER_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "No RELAYER_KEY secret: skipping."; exit 0; fi
          npx hardhat run scripts/demo-credential.ts --network "$NETWORK" || echo "Verified Mandate step failed; the pilot still flies."
      - name: The demo fund's first purchase, if it is still waiting for fresh prices
        env:
          PRIVATE_KEY: ${{ secrets.RELAYER_KEY }}
          FINISH_ONLY: "1"
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "No RELAYER_KEY secret: skipping."; exit 0; fi
          npx hardhat run scripts/demo-fund.ts --network "$NETWORK" || echo "Demo fund step failed; the pilot still flies."
      - name: One check by the demo pilot, on the demo vault and the demo fund
        env:
          PRIVATE_KEY: ${{ env.DEMO_KEY }}
          ONCE: "1"
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "No demo pilot key for $NETWORK: skipping the pilot."; exit 0; fi
          # The demo vault, and the demo fund's vault if there is one: the same pilot flies both.
          for field in demoVault demoFundVault; do
            VAULT=$(node -p "require('./deployments/$NETWORK.json').$field || ''")
            if [ -z "$VAULT" ]; then echo "No $field in deployments/$NETWORK.json."; continue; fi
            VAULT="$VAULT" npx hardhat run agent/run.ts --network "$NETWORK" || echo "The pilot's check on $field failed."
          done
      - name: The pilot's letter to the owner (about once a day)
        env:
          PRIVATE_KEY: ${{ env.DEMO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "No demo pilot key for $NETWORK: skipping the letter."; exit 0; fi
          npx hardhat run scripts/pilot-letter.ts --network "$NETWORK" || echo "Letter step failed; the pilot still flies."
